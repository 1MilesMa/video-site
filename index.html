<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频合集</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%235b9dff'/><path d='M13 10 L23 16 L13 22 Z' fill='%23ffffff'/></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="dot"></span><h1 id="site-title">视频合集</h1></div>
  <p class="subtitle" id="site-subtitle"></p>
</header>

<main>
  <section class="stage">
    <div class="player-wrap">
      <video id="player" controls playsinline preload="metadata"></video>
      <div class="player-empty" id="player-empty">从下面选一个视频开始播放</div>
    </div>
    <div class="now">
      <h2 id="now-title">—</h2>
      <div class="badges" id="now-badges"></div>
    </div>
  </section>

  <section class="grid" id="grid"></section>
</main>

<footer class="foot">
  <span id="foot-info"></span>
  <span class="hint">← / → 切换　·　空格 播放 / 暂停</span>
</footer>
<script src="assets/app.js"></script>
</body>
</html>
